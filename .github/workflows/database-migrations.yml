name: Database migrations

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

# PostgreSQL migrations must never be applied concurrently.
concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  migrate:
    name: Apply pending Supabase migrations
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Push pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          # Configure this GitHub Actions secret with the production Postgres
          # connection string; it must be URL-encoded where required.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
